<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Gallery Kopken Holic — kumpulan momen di Kopi Kenangan.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/gallery.css">
</head>
<body>

  <!-- Navbar: Home + Gallery -->
  <nav class="navbar">
    <div class="container">
      <a href="../index.html" class="navbar__logo">
        <img src="../Logo/LogoKopkenHolic.png" alt="Kopken Holic" height="40">
      </a>
      <div class="navbar__links">
        <a href="../index.html">Home</a>
        <a href="jadwal.html">Jadwal</a>
        <a href="gallery.html" class="is-active">Gallery</a>
      </div>
    </div>
  </nav>

  <!-- Gallery Hero -->
  <header class="gallery-hero">
    <div class="container">
      <div class="gallery-hero__eyebrow">Dokumentasi Komunitas</div>
      <h1 class="gallery-hero__title">Gallery <em>Kopken Holic</em></h1>
      <p class="gallery-hero__subtitle">
        Kumpulan momen kebersamaan di Kopi Kenangan.
      </p>
    </div>
  </header>

  <!-- Gallery Grid — polosan, hanya gambar -->
  <section class="gallery-section">
    <div class="container">
      <div class="doc-grid" id="docGrid">

        <!-- GANTI GAMBAR: ubah src di bawah dengan foto kamu, contoh: src="../assets/foto1.jpg" -->
        <figure class="doc-card">
          <div class="doc-card__thumb">
            <img src="https://picsum.photos/seed/kopken1/800/600" alt="Dokumentasi 1" loading="lazy">
          </div>
        </figure>

        <figure class="doc-card">
          <div class="doc-card__thumb">
            <img src="https://picsum.photos/seed/kopken2/800/600" alt="Dokumentasi 2" loading="lazy">
          </div>
        </figure>

        <figure class="doc-card">
          <div class="doc-card__thumb">
            <img src="https://picsum.photos/seed/kopken3/800/600" alt="Dokumentasi 3" loading="lazy">
          </div>
        </figure>

        <figure class="doc-card">
          <div class="doc-card__thumb">
            <img src="https://picsum.photos/seed/kopken4/800/600" alt="Dokumentasi 4" loading="lazy">
          </div>
        </figure>

        <figure class="doc-card">
          <div class="doc-card__thumb">
            <img src="https://picsum.photos/seed/kopken5/800/600" alt="Dokumentasi 5" loading="lazy">
          </div>
        </figure>

        <figure class="doc-card">
          <div class="doc-card__thumb">
            <img src="https://picsum.photos/seed/kopken6/800/600" alt="Dokumentasi 6" loading="lazy">
          </div>
        </figure>

        <figure class="doc-card">
          <div class="doc-card__thumb">
            <img src="https://picsum.photos/seed/kopken7/800/600" alt="Dokumentasi 7" loading="lazy">
          </div>
        </figure>

        <figure class="doc-card">
          <div class="doc-card__thumb">
            <img src="https://picsum.photos/seed/kopken8/800/600" alt="Dokumentasi 8" loading="lazy">
          </div>
        </figure>

        <figure class="doc-card">
          <div class="doc-card__thumb">
            <img src="https://picsum.photos/seed/kopken9/800/600" alt="Dokumentasi 9" loading="lazy">
          </div>
        </figure>

      </div>

      <div style="text-align:center; margin-top:32px;">
        <a href="../index.html" class="gallery-back">← Kembali ke Beranda</a>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer__inner">
        <div class="footer__text">2026 Kopken Holic. Dibuat dengan semangat dan kafein.</div>
        <div class="footer__links">
          <a href="../index.html">Home</a>
          <a href="jadwal.html">Jadwal</a>
          <a href="gallery.html">Gallery</a>
        </div>
      </div>
    </div>
  </footer>

  <!-- Lightbox polosan — hanya gambar -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox__close" id="lightboxClose" aria-label="Tutup">✕</button>
    <img id="lightboxImg" src="" alt="">
  </div>

  <script>
    // Lightbox simpel — klik gambar untuk preview
    const cards = document.querySelectorAll('.doc-card');
    const lightbox = document.getElementById('lightbox');
    const lbImg = document.getElementById('lightboxImg');
    const lbClose = document.getElementById('lightboxClose');

    cards.forEach(card => {
      card.addEventListener('click', () => {
        const img = card.querySelector('img');
        if (!img) return;
        lbImg.src = img.src;
        lbImg.alt = img.alt;
        lightbox.classList.add('is-open');
        lightbox.setAttribute('aria-hidden','false');
        document.body.style.overflow = 'hidden';
      });
    });

    function closeLb(){
      lightbox.classList.remove('is-open');
      lightbox.setAttribute('aria-hidden','true');
      document.body.style.overflow = '';
    }
    lbClose.addEventListener('click', closeLb);
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox || e.target === lbImg) closeLb(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLb(); });
  </script>
</body>
</html>
